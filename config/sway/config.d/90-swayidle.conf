# Replaces Fedora's /usr/share/sway/config.d/90-swayidle.conf to use the Quickshell
# lock screen (falling back to swaylock, see ~/.local/bin/lock-screen).
#   5 min idle: lock      6 min idle: screen off
#   already locked (Quickshell lock screen or swaylock): screen off after 1 min idle
# No unlock hook: only the password (or a fingerprint) unlocks, `loginctl
# unlock-session` doesn't.
exec swayidle -w \
    timeout 300 '~/.local/bin/lock-screen' \
    timeout 360 'swaymsg "output * power off"' resume 'swaymsg "output * power on"' \
    timeout 60 '{ [ "$(timeout 2 qs ipc call lock isLocked)" = true ] || pgrep -xu "$USER" swaylock >/dev/null; } && swaymsg "output * power off"' \
        resume 'swaymsg "output * power on"' \
    before-sleep '~/.local/bin/lock-screen --wait' \
    lock '~/.local/bin/lock-screen'
