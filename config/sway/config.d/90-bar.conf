# Replaces Fedora's /usr/share/sway/config.d/90-bar.conf (Waybar).
# The bar is Quickshell (~/.config/quickshell). Deleting this file brings back
# Waybar with its default look (it is still installed: sway-config-fedora needs it).
# Started again a second later if it crashes (killed by a signal) while Sway is still
# running: the bar, notifications and lock screen are all Quickshell. Not after a
# normal exit (`qs kill`, or another instance already running: -n).
exec sh -c 'while :; do qs -n; [ $? -ge 128 ] && swaymsg -q -t get_version || break; sleep 1; done'
