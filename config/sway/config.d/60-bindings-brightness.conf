# Replaces Fedora's version: the bar's brightness service changes the level (never
# below 1%) and shows the on-screen indicator (~/.config/quickshell/Osd.qml).
# Still works while the screen is locked.
bindsym --locked {
    XF86MonBrightnessDown exec qs ipc call brightness step -1
    XF86MonBrightnessUp   exec qs ipc call brightness step 1
}
