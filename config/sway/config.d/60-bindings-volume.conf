# Replaces Fedora's version: the bar's volume service changes the level (5% steps,
# up to 100%) and shows the on-screen indicator (~/.config/quickshell/Osd.qml).
# Holding a key is repeated by Quickshell (press starts, release stops), because
# Sway's own repeat stops at the release of any other key. Still works while locked.
bindsym --locked --no-repeat {
    XF86AudioRaiseVolume exec qs ipc call volume hold 1
    XF86AudioLowerVolume exec qs ipc call volume hold -1
    XF86AudioMute        exec qs ipc call volume mute
    XF86AudioMicMute     exec qs ipc call volume micMute
}
bindsym --locked --release {
    XF86AudioRaiseVolume exec qs ipc call volume release 1
    XF86AudioLowerVolume exec qs ipc call volume release -1
}
