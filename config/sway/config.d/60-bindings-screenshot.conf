# Replaces Fedora's version: screenshots go to ~/Pictures/Screenshots, are also
# copied to the clipboard, and show a notification.
# Same file name pattern as the launcher's Capture menu (Launcher.qml, screenshot())
set $shotfile "$HOME/Pictures/Screenshots/screenshot-$(date +%Y-%m-%d_%H-%M-%S).png"
bindsym {
    # Select an area
    Print       exec grimshot --notify savecopy area $shotfile
    # The focused window
    Alt+Print   exec grimshot --notify savecopy active $shotfile
    # The whole current screen
    Ctrl+Print  exec grimshot --notify savecopy output $shotfile
}
