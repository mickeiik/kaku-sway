# Speech to text (voxtype, settings in ~/.config/voxtype/config.toml): hold Super+D,
# speak, let go, and the text is typed where the cursor is. Esc while holding cancels.
bindsym --no-repeat $mod+d exec voxtype record start
bindsym --release $mod+d exec voxtype record stop

# While listening (voxtype switches here when it starts): letting go of D or Super
# stops, whichever comes first. Other keys still reach the app.
mode "voxtype_recording" {
    bindsym --release d exec voxtype record stop; mode "default"
    bindsym --release $mod+d exec voxtype record stop; mode "default"
    bindsym --release Super_L exec voxtype record stop; mode "default"
    bindsym --release Super_R exec voxtype record stop; mode "default"
    bindsym Escape exec voxtype record cancel; mode "default"
}

# While voxtype types the text: modifier keys still held would turn the typed letters
# into shortcuts (Super+h...), so they're ignored. No Escape here: it makes wtype drop
# the first character. F12 gets out if voxtype ever leaves Sway stuck in this mode.
mode "voxtype_suppress" {
    bindsym Super_L nop
    bindsym Super_R nop
    bindsym Control_L nop
    bindsym Control_R nop
    bindsym Alt_L nop
    bindsym Alt_R nop
    bindsym Shift_L nop
    bindsym Shift_R nop
    bindsym F12 mode "default"
}
