# kaku-sway: start after the network is actually up, and retry in seconds if it
# crashes (the shipped unit waits 120 s between restarts).
# Installed as /etc/systemd/system/dnscrypt-proxy.service.d/10-network-online.conf.
[Unit]
After=network-online.target
Wants=network-online.target

[Service]
RestartSec=5
